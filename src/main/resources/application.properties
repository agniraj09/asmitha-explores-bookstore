# Application Configuration
spring.application.name=Asmitha Explores Bookstore

#server.address=0.0.0.0

# Server Configuration ? Render injects PORT env variable
server.port=${PORT:8080}

# Thymeleaf Configuration
# Disable template cache so HTML edits appear on restart (dev-friendly, low overhead in prod)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static resources — content-hash versioning busts browser cache automatically
# whenever styles.css / script.js change (URL becomes /css/styles-<hash>.css)
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.period=0

# Disable DevTools in production
spring.devtools.restart.enabled=false
